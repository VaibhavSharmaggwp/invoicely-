<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <style>
        body { font-family: Arial, sans-serif; color: #333; padding: 20px; }
        .header { text-align: center; border-bottom: 2px solid #333; padding-bottom: 10px; margin-bottom: 20px; }
        .details { margin-bottom: 30px; font-size: 16px; }
        .amount-box { background-color: #f4f4f4; padding: 15px; border-radius: 8px; display: inline-block; }
        .footer { margin-top: 40px; font-size: 12px; color: #777; text-align: center; }
    </style>
</head>
<body>
<div class="header">
    <h1>INVOICE</h1>
    <h3>Invoice Number: <span th:text="${invoiceNumber}">INV-0000</span></h3>
</div>

<div class="details">
    <p><strong>Billed To:</strong> <span th:text="${customerName}">Customer Name</span></p>

    <div class="amount-box">
        <p><strong>Total Amount Due:</strong> ₹<span th:text="${totalAmount}">0.00</span></p>
    </div>

    <p>To view your full itemized bill and pay securely online, please click the payment link provided in the email.</p>
</div>

<div class="footer">
    <p>Generated automatically by Invoicely</p>
</div>
</body>
</html>
