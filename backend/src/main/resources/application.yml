spring:
  application:
    name: invoicely-backend

  profiles:
    active: local

  kafka:
    # 1. Kafka server kahan chal raha hai? (Docker container ka port)
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}

    # 2. Consumer ki settings (Jo messages sunega)
    consumer:
      # Group ID Kafka ko batata hai ki yeh application kis group ka hissa hai.
      # Agar hum Invoicely ke 3 instances chalayenge, toh Group ID same hoga taaki ek message 3 baar process na ho.
      group-id: invoicely-notification-group
      # Messages ko string format mein read karne ke liye
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

    # 3. Producer ki settings (Jo messages bhejega)
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer

  data:
    redis:
      # Docker mein Redis default 6379 port par chalta hai
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5433/invoicely_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:YOUR_DATABASE_PASSWORD}
    driver-class-name: org.postgresql.Driver

  jpa:
    # Hibernate DB ke dialect ko samajh sake isliye Postgres specify kar rahe hain
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    # Console mein SQL queries print karne ke liye taaki hum dekh sakein backend kya execute kar raha hai
    show-sql: true
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true

# Hamara backend server is port par chalega (Must be at root level, not under spring)
server:
  port: 8080

app:
  google:
    client-id: ${GOOGLE_CLIENT_ID:YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com}

